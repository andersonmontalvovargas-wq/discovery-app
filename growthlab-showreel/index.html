<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GrowthLab Showreel</title>
<style>
  @font-face { font-family: 'Montserrat'; src: url(fonts/Montserrat.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Space Grotesk'; src: url(fonts/SpaceGrotesk.woff2) format('woff2'); font-weight: 300 700; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/JetBrainsMono.woff2) format('woff2'); font-weight: 100 800; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; max-height: 100vh; width: auto; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ---------------------------------------------------------------------------
// GrowthLab — 20 s motion design showreel (1080x1920, 9:16, 60 fps)
// Every frame is a pure function of time: window.draw(t), t in seconds.
// Music is 120 BPM (1 beat = 0.5 s); every cut and accent lands on a beat.
// ---------------------------------------------------------------------------
const W = 1080, H = 1920, DUR = 20;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');

const C = {
  bg: '#04050B', bg2: '#0A0D1A', panel: 'rgba(16,20,36,0.82)', line: 'rgba(255,255,255,0.10)',
  lime: '#B6FF3B', cyan: '#22E4FF', violet: '#8B5CFF', pink: '#FF2E9A', amber: '#FFB627',
  white: '#F4F6FB', dim: '#8C93AB', red: '#FF3B5C',
};
// Scene cuts / accents (seconds). audio.py mirrors these.
const HITS = [0, 2, 5, 9, 13, 16.5, 17, 17.5, 18, 18.5];

// ---- math / easing ---------------------------------------------------------
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const ei = p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10);
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const ec = p => 1 - Math.pow(1 - p, 3);
const eob = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const eel = p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * TAU / 3) + 1;
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---- drawing helpers -------------------------------------------------------
const FONT = { m: 'Montserrat', s: '"Space Grotesk"', j: '"JetBrains Mono"' };
const F = (w, size, fam = 'm') => `${w} ${size}px ${FONT[fam]}`;

function txt(s, x, y, o = {}) {
  const { size = 40, w = 700, fam = 'm', color = C.white, align = 'center', base = 'middle',
    alpha = 1, ls = 0, stroke = null, lw = 2, glow = 0, glowColor = null } = o;
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = F(w, size, fam); ctx.textAlign = align; ctx.textBaseline = base; ctx.letterSpacing = ls + 'px';
  if (glow) { ctx.shadowBlur = glow; ctx.shadowColor = glowColor || stroke || color; }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  else { ctx.fillStyle = color; ctx.fillText(s, x, y); }
  ctx.restore();
}
function measure(s, size, w = 900, fam = 'm', ls = 0) {
  ctx.save(); ctx.font = F(w, size, fam); ctx.letterSpacing = ls + 'px';
  const m = ctx.measureText(s).width; ctx.restore(); return m;
}
// Largest font size (<= max) at which s fits in maxW.
const fit = (s, maxW, max, w = 900, fam = 'm', ls = 0) => Math.min(max, max * maxW / measure(s, max, w, fam, ls));

// Per-letter kinetic reveal: each glyph rises from behind a mask with overshoot, staggered.
function kin(s, cx, cy, t, t0, o = {}) {
  const { size = 160, w = 900, fam = 'm', color = C.white, stagger = 0.04, dur = 0.6,
    stroke = null, lw = 3, glow = 0, colorAt = null, ease = eob, mask = true, rot = 0, ls = 0 } = o;
  const chars = [...s];
  ctx.save();
  ctx.font = F(w, size, fam); ctx.letterSpacing = ls + 'px';
  const widths = chars.map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = cx - total / 2;
  if (mask) { ctx.beginPath(); ctx.rect(-200, cy - size * 0.72, W + 400, size * 1.44); ctx.clip(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  chars.forEach((ch, i) => {
    const p = P(t, t0 + i * stagger, t0 + i * stagger + dur);
    const cxl = x + widths[i] / 2; x += widths[i];
    if (p <= 0) return;
    const e = ease(p);
    const col = colorAt ? colorAt(i) : color;
    ctx.save();
    ctx.globalAlpha = clamp(p * 2.5);
    ctx.translate(cxl, cy + (1 - e) * size * 1.1);
    if (rot) ctx.rotate((1 - e) * rot * (i % 2 ? 1 : -1));
    if (glow) { ctx.shadowBlur = glow; ctx.shadowColor = stroke || col; }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.strokeText(ch, 0, 0); }
    else { ctx.fillStyle = col; ctx.fillText(ch, 0, 0); }
    ctx.restore();
  });
  ctx.restore();
  return total;
}

// Typewriter text with a block cursor.
function typed(s, x, y, t, t0, cps, o = {}) {
  if (t < t0) return 0;
  const chars = [...s];
  const n = Math.floor(clamp((t - t0) * cps, 0, chars.length));
  const shown = chars.slice(0, n).join('');
  const size = o.size || 28;
  txt(shown, x, y, { fam: 'j', w: 500, align: 'left', ...o });
  if (o.cursor !== false && (n < chars.length || Math.floor(t * 4) % 2 === 0)) {
    const mw = measure(shown, size, o.w || 500, 'j');
    ctx.save(); ctx.globalAlpha = (o.alpha ?? 1) * 0.9; ctx.fillStyle = o.cursorColor || C.lime;
    ctx.fillRect(x + mw + 4, y - size * 0.55, size * 0.55, size * 1.1);
    ctx.restore();
  }
  return n / chars.length;
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function glowBlob(x, y, r, col) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
// Glass panel with a subtle border.
function panel(x, y, w, h, r = 28, o = {}) {
  ctx.save();
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18; }
  rr(x, y, w, h, r); ctx.fillStyle = o.fill || C.panel; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 2; ctx.strokeStyle = o.stroke || 'rgba(255,255,255,0.12)'; ctx.stroke();
  ctx.restore();
}
const pillW = (s, size = 28) => measure(s, size, 600, 'j', 1) + 74;
// Pill tag with a colored dot.
function pill(s, x, y, col, o = {}) {
  const size = o.size || 28, padX = 24, h = size * 1.9;
  const tw = measure(s, size, 600, 'j', 1);
  const w = tw + padX * 2 + 26;
  const sc = o.scale ?? 1;
  if (sc <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.globalAlpha *= o.alpha ?? 1;
  const ax = o.align === 'right' ? -w : o.align === 'center' ? -w / 2 : 0;
  ctx.shadowColor = hexA(col, 0.6); ctx.shadowBlur = 30;
  rr(ax, -h / 2, w, h, h / 2); ctx.fillStyle = 'rgba(10,12,24,0.88)'; ctx.fill();
  ctx.shadowBlur = 0; ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(ax + padX + 5, 0, 7, 0, TAU); ctx.fill();
  txt(s, ax + padX + 26, 1, { fam: 'j', w: 600, size, align: 'left', color: C.white, ls: 1 });
  ctx.restore();
}

function bez(p0, p1, p2, p3, u) {
  const v = 1 - u;
  return [v*v*v*p0[0] + 3*v*v*u*p1[0] + 3*v*u*u*p2[0] + u*u*u*p3[0],
          v*v*v*p0[1] + 3*v*v*u*p1[1] + 3*v*u*u*p2[1] + u*u*u*p3[1]];
}
function partialBez(a, b, c, d, p, N = 60) {
  ctx.beginPath(); ctx.moveTo(a[0], a[1]);
  const end = p * N;
  for (let i = 1; i <= Math.ceil(end); i++) { const q = bez(a, b, c, d, Math.min(i, end) / N); ctx.lineTo(q[0], q[1]); }
}

function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.62);
  ctx.bezierCurveTo(x - s * 1.25, y - s * 0.1, x - s * 0.6, y - s * 0.95, x, y - s * 0.38);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 0.95, x + s * 1.25, y - s * 0.1, x, y + s * 0.62);
  ctx.closePath();
}
function checkMark(x, y, s, p = 1, col = C.bg, lw = 8) {
  const pts = [[x - s * 0.5, y], [x - s * 0.12, y + s * 0.38], [x + s * 0.55, y - s * 0.42]];
  const l1 = Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]), l2 = Math.hypot(pts[2][0] - pts[1][0], pts[2][1] - pts[1][1]);
  const L = (l1 + l2) * p;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  if (L <= l1) ctx.lineTo(lerp(pts[0][0], pts[1][0], L / l1), lerp(pts[0][1], pts[1][1], L / l1));
  else { ctx.lineTo(...pts[1]); const q = (L - l1) / l2; ctx.lineTo(lerp(pts[1][0], pts[2][0], q), lerp(pts[1][1], pts[2][1], q)); }
  ctx.stroke(); ctx.restore();
}

// ---- brand mark --------------------------------------------------------------
// GrowthLab icon: rounded square, three rising bars and a growth arrow.
function logoShapes(cx, cy, S) {
  const r = S * 0.27, h = S / 2;
  const bars = [[-0.27, 0.16], [-0.07, 0.29], [0.13, 0.42]].map(([x, bh]) =>
    [cx + x * S, cy + 0.30 * S - bh * S, 0.14 * S, bh * S]);
  const arrow = [[cx - 0.31 * S, cy - 0.02 * S], [cx - 0.12 * S, cy - 0.17 * S], [cx + 0.02 * S, cy - 0.08 * S], [cx + 0.29 * S, cy - 0.31 * S]];
  return { r, h, bars, arrow };
}
function polyLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); return L; }
function partialPoly(pts, p) {
  const L = polyLen(pts) * p; let acc = 0;
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  for (let i = 1; i < pts.length; i++) {
    const seg = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
    if (acc + seg >= L) { const q = (L - acc) / seg; ctx.lineTo(lerp(pts[i-1][0], pts[i][0], q), lerp(pts[i-1][1], pts[i][1], q)); return; }
    ctx.lineTo(...pts[i]); acc += seg;
  }
}
function arrowHead(pts, size, col) {
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  ctx.save(); ctx.translate(b[0], b[1]); ctx.rotate(ang); ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(size * 0.55, 0); ctx.lineTo(-size * 0.45, -size * 0.55); ctx.lineTo(-size * 0.45, size * 0.55); ctx.closePath(); ctx.fill();
  ctx.restore();
}
// draw: 0..1 stroke progress, fill: 0..1 fill opacity
function logoIcon(cx, cy, S, draw = 1, fill = 1, o = {}) {
  const { r, h, bars, arrow } = logoShapes(cx, cy, S);
  ctx.save();
  if (fill > 0) {
    ctx.globalAlpha = fill;
    const g = ctx.createLinearGradient(cx - h, cy + h, cx + h, cy - h);
    g.addColorStop(0, C.lime); g.addColorStop(1, C.cyan);
    if (o.glow) { ctx.shadowColor = hexA(C.lime, 0.8); ctx.shadowBlur = o.glow; }
    rr(cx - h, cy - h, S, S, r); ctx.fillStyle = g; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.bg;
    for (const b of bars) { rr(b[0], b[1], b[2], b[3], S * 0.03); ctx.fill(); }
    ctx.strokeStyle = C.bg; ctx.lineWidth = S * 0.065; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    partialPoly(arrow, 1); ctx.stroke(); arrowHead(arrow, S * 0.16, C.bg);
    ctx.globalAlpha = 1;
  }
  if (draw > 0 && fill < 1) {
    ctx.globalAlpha = 1 - fill;
    ctx.strokeStyle = C.lime; ctx.lineWidth = Math.max(2, S * 0.022); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowColor = C.lime; ctx.shadowBlur = 24;
    // outline of the rounded square, traced as a polyline
    const sq = [];
    const corners = [[cx + h - r, cy - h + r, -Math.PI / 2], [cx + h - r, cy + h - r, 0], [cx - h + r, cy + h - r, Math.PI / 2], [cx - h + r, cy - h + r, Math.PI]];
    sq.push([cx, cy - h]);
    for (const [ox, oy, a0] of corners) for (let k = 0; k <= 8; k++) { const a = a0 + k / 8 * Math.PI / 2; sq.push([ox + Math.cos(a) * r, oy + Math.sin(a) * r]); }
    sq.push([cx, cy - h]);
    partialPoly(sq, eio(P(draw, 0, 0.75))); ctx.stroke();
    bars.forEach((b, i) => {
      const p = P(draw, 0.3 + i * 0.1, 0.65 + i * 0.1);
      if (p <= 0) return;
      partialPoly([[b[0], b[1] + b[3]], [b[0], b[1]], [b[0] + b[2], b[1]], [b[0] + b[2], b[1] + b[3]], [b[0], b[1] + b[3]]], p); ctx.stroke();
    });
    const pa = P(draw, 0.55, 1);
    if (pa > 0) { partialPoly(arrow, pa); ctx.stroke(); if (pa >= 1) arrowHead(arrow, S * 0.16, C.lime); }
  }
  ctx.restore();
}

// ---- persistent background layers ------------------------------------------
const R0 = rng(11);
const PARTS = Array.from({ length: 130 }, () => ({
  x: R0() * W, y: R0() * H, z: R0(), s: R0() * 2.4 + 0.6,
  c: [C.lime, C.cyan, C.violet, C.pink, C.white][Math.floor(R0() * 5)], ph: R0() * TAU,
}));

// palette of the two moving glows per scene
const GLOWS = [
  [C.lime, C.violet], [C.cyan, C.violet], [C.pink, C.violet], [C.amber, C.cyan], [C.cyan, C.lime], [C.lime, C.pink], [C.lime, C.cyan],
];
function background(t, si) {
  ctx.fillStyle = C.bg; ctx.fillRect(-120, -120, W + 240, H + 240);
  const [g1, g2] = GLOWS[si];
  glowBlob(540 + Math.sin(t * .7) * 300, 560 + Math.cos(t * .5) * 240, 820, hexA(g1, 0.17));
  glowBlob(540 + Math.cos(t * .6) * 320, 1420 + Math.sin(t * .8) * 220, 900, hexA(g2, 0.20));
  glowBlob(540 + Math.sin(t * .9 + 2) * 340, 960 + Math.cos(t * 1.1) * 200, 560, hexA(C.pink, 0.07));
  // perspective floor grid, scrolling toward the viewer
  const hz = 1240;
  ctx.save();
  ctx.strokeStyle = hexA(si === 2 ? C.pink : C.cyan, 0.17); ctx.lineWidth = 1.5;
  for (let i = -18; i <= 18; i++) { ctx.beginPath(); ctx.moveTo(540 + i * 20, hz); ctx.lineTo(540 + i * 320, H + 120); ctx.stroke(); }
  const off = (t * 1.0) % 1;
  for (let j = 0; j < 16; j++) {
    const y = hz + (H + 120 - hz) * Math.pow((j + off) / 16, 2.3);
    ctx.globalAlpha = clamp((y - hz) / 300) * 0.9;
    ctx.beginPath(); ctx.moveTo(-120, y); ctx.lineTo(W + 120, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const fade = ctx.createLinearGradient(0, hz - 10, 0, hz + 300);
  fade.addColorStop(0, C.bg); fade.addColorStop(1, 'rgba(4,5,11,0)');
  ctx.fillStyle = fade; ctx.fillRect(-120, hz - 10, W + 240, 310);
  // horizon line glow
  const hl = ctx.createLinearGradient(0, 0, W, 0);
  hl.addColorStop(0, 'rgba(0,0,0,0)'); hl.addColorStop(0.5, hexA(g1, 0.5)); hl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hl; ctx.fillRect(0, hz - 1, W, 2);
  // floating particles (bokeh)
  for (const p of PARTS) {
    const y = ((p.y - t * (24 + p.z * 120)) % H + H) % H;
    ctx.globalAlpha = (0.15 + p.z * 0.5) * (0.6 + 0.4 * Math.sin(t * 3 + p.ph));
    ctx.fillStyle = p.c; ctx.beginPath();
    ctx.arc(p.x + Math.sin(t * 0.8 + p.ph) * 26, y, p.s * (0.5 + p.z * 1.2), 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// ---- HUD ---------------------------------------------------------------------
const SECTIONS = [
  [0, '01', 'KINETIC TYPOGRAPHY', C.lime], [2, '02', '3D PARTICLES', C.cyan], [5, '03', 'UI ANIMATION', C.pink],
  [9, '04', 'MOTION INFOGRAPHICS', C.amber], [13, '05', 'DATA VISUALIZATION', C.cyan], [16.5, '06', 'BEAT-SYNC TYPE', C.lime],
  [18, '07', 'LOGO ANIMATION', C.lime],
];
function hud(t) {
  const a = clamp(P(t, 0.15, 0.6)) * (1 - P(t, 19.3, 19.7));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const m = 44, L = 70;
  ctx.strokeStyle = 'rgba(244,246,251,0.6)'; ctx.lineWidth = 3;
  for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  }
  // center crosshair ticks
  ctx.strokeStyle = 'rgba(244,246,251,0.25)'; ctx.lineWidth = 2;
  for (const [x, y, dx, dy] of [[540, m, 0, 1], [540, H - m, 0, -1], [m, 960, 1, 0], [W - m, 960, -1, 0]]) {
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx * 22, y + dy * 22); ctx.stroke();
  }
  const fr = Math.floor(t * 60) % 60, s = Math.floor(t);
  const tc = `00:00:${String(s).padStart(2, '0')}:${String(fr).padStart(2, '0')}`;
  txt(tc, 88, 104, { fam: 'j', w: 600, size: 25, align: 'left', color: C.white, ls: 2, alpha: 0.75 });
  txt('60FPS · 1080×1920', 88, 140, { fam: 'j', w: 500, size: 19, align: 'left', color: C.dim, ls: 2 });
  if (Math.floor(t * 2) % 2 === 0) {
    ctx.fillStyle = C.red; ctx.shadowColor = C.red; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(W - 176, 104, 10, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  }
  txt('REC', W - 88, 104, { fam: 'j', w: 700, size: 25, align: 'right', color: C.white, ls: 3, alpha: 0.85 });
  txt('GROWTHLAB®', W - 88, 140, { fam: 'j', w: 500, size: 19, align: 'right', color: C.dim, ls: 2 });
  // scene label
  let cur = SECTIONS[0];
  for (const sct of SECTIONS) if (t >= sct[0]) cur = sct;
  const p = eo(P(t, cur[0] + 0.05, cur[0] + 0.55));
  ctx.save(); ctx.beginPath(); ctx.rect(70, H - 182, 940, 64); ctx.clip();
  const yy = H - 150 + (1 - p) * 64;
  rr(88, yy - 21, 62, 42, 8); ctx.fillStyle = cur[3]; ctx.fill();
  txt(cur[1], 119, yy + 1, { fam: 'j', w: 800, size: 26, color: C.bg });
  txt(cur[2], 168, yy + 1, { fam: 'j', w: 600, size: 26, align: 'left', color: C.white, ls: 4 });
  txt('SHOWREEL 2026', W - 88, yy + 1, { fam: 'j', w: 500, size: 20, align: 'right', color: C.dim, ls: 3 });
  ctx.restore();
  // progress bar with section ticks
  const bx = 88, bw = W - 176, by = H - 104;
  ctx.fillStyle = 'rgba(244,246,251,0.14)'; ctx.fillRect(bx, by, bw, 4);
  ctx.fillStyle = cur[3]; ctx.fillRect(bx, by, bw * (t / DUR), 4);
  ctx.fillStyle = 'rgba(244,246,251,0.45)';
  for (const sct of SECTIONS) ctx.fillRect(bx + bw * sct[0] / DUR - 1, by - 8, 2, 20);
  ctx.fillStyle = cur[3]; ctx.shadowColor = cur[3]; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(bx + bw * (t / DUR), by + 2, 8, 0, TAU); ctx.fill();
  ctx.restore();
}

// ---- finishing: grain + vignette + glitch ------------------------------------
const GRAIN = [0, 1, 2, 3].map(k => {
  const g = document.createElement('canvas'); g.width = g.height = 256;
  const gc = g.getContext('2d'); const id = gc.createImageData(256, 256); const r = rng(100 + k);

    ctx.save();

    ctx.beginPath(); ctx.moveTo(-wt / 2, -b.h / 2); ctx.lineTo(wt / 2, -b.h / 2); ctx.lineTo(wb / 2, b.h / 2); ctx.lineTo(-wb / 2, b.h / 2); ctx.closePath();
    const g = ctx.createLinearGradient(-wt / 2, 0, wt / 2, 0);
    g.addColorStop(0, hexA(col, 0.10)); g.addColorStop(0.5, hexA(col, 0.30)); g.addColorStop(1, hexA(col, 0.10));
    ctx.fillStyle = g; ctx.fill();
    ctx.shadowColor = col; ctx.shadowBlur = 24; ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
    const tp = P(lt, 0.4 + i * 0.22, 0.7 + i * 0.22);
    txt(name, 540, b.cy - 20, { size: 44, w: 900, alpha: tp, ls: 2 });
    txt(metric, 540, b.cy + 28, { fam: 'j', size: 25, w: 600, color: col, alpha: tp });
    txt(String(i + 1).padStart(2, '0'), 540 - wt / 2 + 40, b.y0 + 26, { fam: 'j', size: 18, w: 700, color: col, alpha: tp * (i < 3 ? 1 : 0) });
  });

  // curved connectors on alternating sides, each with a rate label and traveling pulses
  for (let i = 0; i < 4; i++) {
    const a = stageBox(i), b = stageBox(i + 1), side = i % 2 ? -1 : 1;
    const p0 = [540 + side * (funW(a.cy) / 2 + 6), a.cy], p3 = [540 + side * (funW(b.cy) / 2 + 6), b.cy];
    const bulge = 120;
    const p1 = [p0[0] + side * bulge, p0[1] + 10], p2 = [p3[0] + side * bulge, p3[1] - 10];
    const t0 = 1.2 + i * 0.28, dp = eio(P(lt, t0, t0 + 0.5));
    if (dp <= 0) continue;
    const col = STAGES[i + 1][2];
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.shadowColor = col; ctx.shadowBlur = 18;
    ctx.setLineDash([2, 12]); partialBez(p0, p1, p2, p3, dp); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 0.5; partialBez(p0, p1, p2, p3, dp); ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
    // arrowhead dot at the end / head of the stroke
    const hd = bez(p0, p1, p2, p3, dp); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hd[0], hd[1], 7, 0, TAU); ctx.fill();
    // pulses
    if (dp >= 1) for (let k = 0; k < 3; k++) {
      const u = ((lt - t0) * 1.1 + k / 3) % 1, q = bez(p0, p1, p2, p3, u);
      ctx.globalAlpha = Math.sin(u * Math.PI); ctx.fillStyle = col; ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.arc(q[0], q[1], 9, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(q[0], q[1], 4, 0, TAU); ctx.fill();
    }
    ctx.restore();
    // rate label at the bulge
    const m = bez(p0, p1, p2, p3, 0.5);
    const lp = eob(P(lt, t0 + 0.3, t0 + 0.6));
    if (lp > 0) {
      const lw = measure(RATES[i], 24, 700, 'j') + 30;
      ctx.save(); ctx.translate(clamp(m[0], 60 + lw / 2, 1020 - lw / 2), m[1]); ctx.scale(lp, lp);
      rr(-lw / 2, -22, lw, 44, 22); ctx.fillStyle = col; ctx.fill();
      txt(RATES[i], 0, 1, { fam: 'j', size: 24, w: 800, color: C.bg });
      ctx.restore();
    }
  }

  // sales counter
  const cp = eo(P(lt, 0.9, 1.3));
  if (cp > 0) {
    const y = 1480 + (1 - cp) * 60;
    ctx.save(); ctx.globalAlpha = cp;
    panel(130, y, 820, 170, 30, { fill: 'rgba(10,12,24,0.88)', stroke: hexA(C.pink, 0.55) });
    const sales = Math.round(642 * eio(P(lt, 1.4, 3.0)));
    const pulse = 1 + 0.12 * (1 - eo(P(lt, 3.0, 3.35))) * (lt >= 3.0 ? 1 : 0);
    txt('VENTAS', 180, y + 52, { fam: 'j', size: 24, w: 700, align: 'left', color: C.dim, ls: 4 });
    txt('TASA DE CIERRE 0.53%', 180, y + 128, { fam: 'j', size: 21, w: 500, align: 'left', color: C.dim, ls: 1 });
    ctx.save(); ctx.translate(900, y + 92); ctx.scale(pulse, pulse);
    txt(fmt(sales), 0, 0, { size: 112, w: 900, align: 'right', color: lt >= 3.0 ? C.lime : C.white, glow: lt >= 3.0 ? 30 : 0 });
    ctx.restore();
    // ticker bars
    for (let k = 0; k < 12; k++) {
      const hh = 8 + 34 * Math.abs(Math.sin(k * 1.7 + lt * 4)) * eio(P(lt, 1.4, 3.0));
      ctx.fillStyle = hexA(C.pink, 0.8); ctx.fillRect(340 + k * 16, y + 52 - hh / 2, 8, hh);
    }
    ctx.restore();
  }
}

// =============================================================================
// SCENE 5 · Results dashboard (13–16.5 s)
// =============================================================================
const BARS = [22, 28, 26, 35, 41, 39, 52, 58, 66, 74, 86, 100];
function scene5(t) {
  const lt = t - 13;
  kin('RESULTADOS', 540, 270, t, 13.05, { size: fit('RESULTADOS', 900, 140), stagger: .03, dur: .45, colorAt: i => i < 3 ? C.cyan : C.white });
  txt('Q3 2026 · META ADS + GOOGLE ADS + EMAIL', 540, 370, { fam: 'j', w: 500, size: 23, color: C.dim, ls: 2, alpha: P(lt, 0.3, 0.7) });

  // ring card
  const c1 = eob(P(lt, 0.1, 0.5));
  ctx.save(); ctx.translate(290, 640); ctx.scale(c1, c1); ctx.translate(-290, -640);
  panel(90, 440, 400, 400, 34);
  const rp = eio(P(lt, 0.35, 1.8)) * 0.94;
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 26; ctx.beginPath(); ctx.arc(290, 625, 130, 0, TAU); ctx.stroke();
  const rg = ctx.createLinearGradient(160, 500, 420, 760); rg.addColorStop(0, C.cyan); rg.addColorStop(1, C.lime);
  ctx.strokeStyle = rg; ctx.shadowColor = C.lime; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(290, 625, 130, -Math.PI / 2, -Math.PI / 2 + TAU * rp); ctx.stroke(); ctx.shadowBlur = 0;
  const ea = -Math.PI / 2 + TAU * rp; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(290 + Math.cos(ea) * 130, 625 + Math.sin(ea) * 130, 9, 0, TAU); ctx.fill();
  ctx.strokeStyle = hexA(C.cyan, 0.3); ctx.lineWidth = 2; ctx.setLineDash([3, 8]);
  ctx.save(); ctx.translate(290, 625); ctx.rotate(lt * 0.8); ctx.beginPath(); ctx.arc(0, 0, 96, 0, TAU); ctx.stroke(); ctx.restore(); ctx.setLineDash([]);
  txt(Math.round(rp * 100) + '%', 290, 615, { size: 72, w: 900 });
  txt('DEL OBJETIVO', 290, 670, { fam: 'j', size: 18, w: 600, color: C.dim, ls: 2 });
  txt('META DE VENTAS', 290, 800, { fam: 's', size: 24, w: 600, color: C.white, alpha: 0.85 });
  ctx.restore();

  // KPI cards
  const KPI = [['ROAS', v => v.toFixed(1) + 'x', 0, 6.2, '▲ +2.4x', C.lime], ['CPA', v => '$' + v.toFixed(2), 12.4, 4.1, '▼ -58%', C.cyan],
    ['CONVERSIONES', v => '+' + Math.round(v) + '%', 0, 318, '▲ vs Q2', C.amber]];
  KPI.forEach(([label, f, a, b, delta, col], i) => {
    const x = 520, y = 440 + i * 136, p = eo(P(lt, 0.2 + i * 0.12, 0.6 + i * 0.12));
    if (p <= 0) return;
    ctx.save(); ctx.globalAlpha = p; ctx.translate((1 - p) * 120, 0);
    panel(x, y, 470, 120, 26);
    ctx.fillStyle = col; rr(x, y + 26, 6, 68, 3); ctx.fill();
    txt(label, x + 34, y + 38, { fam: 'j', size: 20, w: 700, align: 'left', color: C.dim, ls: 3 });
    const v = lerp(a, b, eo(P(lt, 0.45 + i * 0.12, 2.0 + i * 0.1)));
    txt(f(v), x + 34, y + 84, { size: 50, w: 900, align: 'left' });
    rr(x + 470 - 30 - measure(delta, 20, 700, 'j') - 28, y + 66, measure(delta, 20, 700, 'j') + 28, 38, 19); ctx.fillStyle = hexA(col, 0.16); ctx.fill();
    txt(delta, x + 470 - 44, y + 86, { fam: 'j', size: 20, w: 700, align: 'right', color: col });
    // sparkline
    ctx.strokeStyle = hexA(col, 0.8); ctx.lineWidth = 3; ctx.beginPath();
    for (let k = 0; k <= 12; k++) { const sx = x + 300 + k * 11, sy = y + 40 - (b > a ? 1 : -1) * (k * 1.4 + Math.sin(k * 1.9 + i) * 5) * eo(P(lt, 0.5, 1.6)); k ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); }
    ctx.stroke();
    ctx.restore();
  });

  // bar chart + trend line
  const cp = eo(P(lt, 0.35, 0.8));
  if (cp > 0) {
    const x = 90, y = 880, w = 900, h = 700;
    ctx.save(); ctx.globalAlpha = cp; ctx.translate(0, (1 - cp) * 80);
    panel(x, y, w, h, 34);
    txt('INGRESOS MENSUALES', x + 40, y + 52, { fam: 'j', size: 22, w: 700, align: 'left', color: C.dim, ls: 3 });
    txt('$1.84M', x + 40, y + 108, { size: 60, w: 900, align: 'left' });
    const gx = x + 60, gy = y + 620, gw = w - 110, gh = 400;
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 2;
    for (let k = 0; k <= 4; k++) { ctx.beginPath(); ctx.moveTo(gx, gy - k * gh / 4); ctx.lineTo(gx + gw, gy - k * gh / 4); ctx.stroke(); }
    const bw = gw / BARS.length;
    const tops = [];
    BARS.forEach((v, k) => {
      const bp = eob(P(lt, 0.6 + k * 0.07, 1.1 + k * 0.07));
      const bh = gh * v / 100 * bp;
      const bx = gx + k * bw + bw * 0.2;
      const g = ctx.createLinearGradient(0, gy - bh, 0, gy);
      g.addColorStop(0, k === 11 ? C.lime : C.cyan); g.addColorStop(1, hexA(k === 11 ? C.lime : C.violet, 0.25));
      rr(bx, gy - bh, bw * 0.6, Math.max(0, bh), [10, 10, 0, 0]); ctx.fillStyle = g; ctx.fill();
      tops.push([bx + bw * 0.3, gy - gh * v / 100 - 26]);
      txt('EFMAMJJASOND'[k], bx + bw * 0.3, gy + 30, { fam: 'j', size: 20, w: 600, color: C.dim });
    });
    // trend line drawn across bar tops
    const lp = eio(P(lt, 1.5, 2.5));
    if (lp > 0) {
      ctx.save(); ctx.strokeStyle = C.amber; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.shadowColor = C.amber; ctx.shadowBlur = 20;
      partialPoly(tops, lp); ctx.stroke();
      ctx.shadowBlur = 0;
      const n = Math.floor(lp * (tops.length - 1) + 1e-6);
      for (let k = 0; k <= n; k++) { ctx.fillStyle = C.bg; ctx.beginPath(); ctx.arc(tops[k][0], tops[k][1], 8, 0, TAU); ctx.fill(); ctx.strokeStyle = C.amber; ctx.lineWidth = 4; ctx.stroke(); }
      ctx.restore();
    }
    ctx.restore();
    // growth tag pops on the beat
    const gp = eob(P(lt, 2.5, 2.85));
    if (lt > 2.5) {
      ctx.save(); ctx.translate(800, 990 + (1 - cp) * 80); ctx.rotate(-0.06); ctx.scale(gp, gp);
      ctx.shadowColor = C.lime; ctx.shadowBlur = 40;
      rr(-160, -42, 320, 84, 42); ctx.fillStyle = C.lime; ctx.fill(); ctx.shadowBlur = 0;
      txt('▲ +247%', 0, -4, { size: 40, w: 900, color: C.bg });
      txt('CRECIMIENTO', 0, 26, { fam: 'j', size: 15, w: 800, color: C.bg, ls: 3 });
      ctx.restore();
      // burst lines
      const bp = P(lt, 2.5, 2.9);
      if (bp < 1) {
        ctx.save(); ctx.strokeStyle = C.lime; ctx.lineWidth = 4; ctx.globalAlpha = 1 - bp; ctx.lineCap = 'round';
        for (let k = 0; k < 12; k++) { const a = k * TAU / 12, r1 = 180 + eo(bp) * 60, r2 = r1 + 30 * (1 - bp);
          ctx.beginPath(); ctx.moveTo(800 + Math.cos(a) * r1, 990 + Math.sin(a) * r1 * 0.45); ctx.lineTo(800 + Math.cos(a) * r2, 990 + Math.sin(a) * r2 * 0.45); ctx.stroke(); }
        ctx.restore();
      }
    }
  }
}

// =============================================================================
// SCENE 6 · Three words, one per beat (16.5–18 s)
// =============================================================================
const WORDS = [[16.5, 'ATRAE.', C.lime, C.bg], [17.0, 'CONVIERTE.', C.bg, C.white], [17.5, 'ESCALA.', C.violet, C.white]];
function scene6(t) {
  let k = 0; for (let i = 0; i < 3; i++) if (t >= WORDS[i][0]) k = i;
  const [t0, word, bgc, fg] = WORDS[k];
  const lt = t - t0;
  ctx.fillStyle = bgc; ctx.fillRect(-120, -120, W + 240, H + 240);
  if (k === 1) { glowBlob(540, 960, 900, hexA(C.pink, 0.35)); }
  // background rows of the repeated word, scrolling in alternating directions
  const rs = 150;
  ctx.save(); ctx.font = F(900, rs); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const rowW = ctx.measureText(word + ' ').width;
  for (let r = -1; r < 14; r++) {
    const y = r * rs * 0.95 + 40;
    if (Math.abs(y - 960) < 150) continue;
    const dir = r % 2 ? 1 : -1, off = ((t * 520 * dir + r * 137) % rowW + rowW) % rowW;
    ctx.globalAlpha = 0.16 + (r % 3 === 0 ? 0.08 : 0);
    ctx.strokeStyle = fg; ctx.lineWidth = 2.5;
    for (let x = -off - rowW; x < W + rowW; x += rowW) {
      if (r % 4 === 1) { ctx.fillStyle = fg; ctx.globalAlpha = 0.07; ctx.fillText(word, x, y); ctx.globalAlpha = 0.16; }
      else ctx.strokeText(word, x, y);
    }
  }
  ctx.restore();
  // main word slam
  const size = fit(word, 960, 240);
  const p = P(lt, 0, 0.22);
  let s = lerp(1.6, 1, eo(p)) + (k === 2 ? ei(P(t, 17.82, 18.0)) * 9 : 0);
  ctx.save(); ctx.translate(540, 960); ctx.scale(s, s);
  // offset echo layers
  for (const [dx, col] of [[-10, C.pink], [10, C.cyan]]) {
    ctx.globalAlpha = 0.7 * (1 - eo(P(lt, 0, 0.3)));
    txt(word, dx * (1 - p), 0, { size, w: 900, color: col });
  }
  ctx.globalAlpha = 1;
  txt(word, 0, 0, { size, w: 900, color: fg });
  ctx.restore();
  // index + bar
  const ip = eo(P(lt, 0.02, 0.25));
  ctx.fillStyle = fg; ctx.fillRect(540 - 120 * ip, 960 + size * 0.62, 240 * ip, 6);
  txt(`0${k + 1} / 03`, 540, 960 + size * 0.62 + 46, { fam: 'j', w: 700, size: 26, color: fg, ls: 6, alpha: ip });
}

// =============================================================================
// SCENE 7 · Logo reveal (18–20 s)
// =============================================================================
const WORDMARK = Object.assign(document.createElement('canvas'), { width: W, height: 260 });
function scene7(t) {
  const lt = t - 18;
  const LX = 540, LY = 760, S = 300;
  glowBlob(LX, LY, 700, hexA(C.lime, 0.18 * P(lt, 0, 0.5)));
  // shockwave from the explosion
  for (const [d, col] of [[0.5, C.lime], [0.58, C.cyan], [0.7, C.white]]) {
    const p = P(lt, d, d + 0.9);
    if (p > 0 && p < 1) {
      ctx.save(); ctx.strokeStyle = col; ctx.globalAlpha = (1 - p) * 0.9; ctx.lineWidth = 18 * (1 - p) + 1;
      ctx.shadowColor = col; ctx.shadowBlur = 30; ctx.beginPath(); ctx.arc(LX, LY, 160 + eo(p) * 900, 0, TAU); ctx.stroke(); ctx.restore();
    }
  }
  // particle explosion from the icon
  const ep = P(lt, 0.5, 1.6);
  if (ep > 0 && ep < 1) {
    const r = rng(21);
    ctx.save();
    for (let k = 0; k < 160; k++) {
      const a = r() * TAU, v = 200 + r() * 800, s = 2 + r() * 5;
      const d = eo(ep) * v;
      const x = LX + Math.cos(a) * (S * 0.45 + d), y = LY + Math.sin(a) * (S * 0.45 + d) + ep * ep * 120;
      ctx.globalAlpha = (1 - ep) * (0.6 + r() * 0.4);
      ctx.fillStyle = [C.lime, C.cyan, C.white, C.amber, C.pink][k % 5];
      ctx.beginPath(); ctx.arc(x, y, s * (1 - ep * 0.5), 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  // icon: stroke draws, fills, then punches on the explosion beat
  const draw = P(lt, 0.0, 0.42), fill = eo(P(lt, 0.38, 0.5));
  const pop = lt >= 0.5 ? 1 + 0.18 * Math.exp(-(lt - 0.5) * 8) * Math.cos((lt - 0.5) * 30) : lerp(0.85, 1, eo(P(lt, 0, 0.5)));
  ctx.save(); ctx.translate(LX, LY); ctx.scale(pop, pop); ctx.rotate((1 - eo(P(lt, 0, 0.5))) * -0.2); ctx.translate(-LX, -LY);
  logoIcon(LX, LY, S, draw, fill, { glow: 50 * fill });
  ctx.restore();
  // wordmark letter by letter, with a light sweep
  const size = fit('GROWTHLAB', 900, 150);
  const ny = 1035;
  if (lt > 0.5) {
    const off = WORDMARK, o = off.getContext('2d');
    o.setTransform(1, 0, 0, 1, 0, 0); o.globalCompositeOperation = 'source-over'; o.clearRect(0, 0, W, 260);
    ctxSwap(o, () => {
      ctx.translate(0, -ny + 130);
      kin('GROWTHLAB', 540, ny, t, 18.55, { size, stagger: .045, dur: .4, colorAt: i => i >= 6 ? C.lime : C.white, ls: -2 });
    });
    const sp = P(lt, 1.1, 1.55);
    if (sp > 0 && sp < 1) {
      o.globalCompositeOperation = 'source-atop';
      const sx = lerp(-200, W + 200, eio(sp));
      const g = o.createLinearGradient(sx - 140, 0, sx + 140, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      o.fillStyle = g; o.fillRect(0, 0, W, 260);
    }
    ctx.drawImage(off, 0, ny - 130);
  }
  txt('Crecimiento impulsado por datos', 540, 1160, { fam: 's', w: 500, size: 42, color: C.white, alpha: eo(P(lt, 1.0, 1.3)) });
  const lp = eo(P(lt, 1.05, 1.4));
  ctx.fillStyle = C.lime; ctx.fillRect(540 - 220 * lp, 1230, 440 * lp, 3);
  txt('SEO · META ADS · GOOGLE ADS · EMAIL · ANALYTICS', 540, 1290, { fam: 'j', w: 500, size: 22, color: C.dim, ls: 2, alpha: P(lt, 1.15, 1.4) });
  txt('MOTION DESIGN SHOWREEL · 2026', 540, 1420, { fam: 'j', w: 700, size: 28, color: C.white, ls: 6, alpha: P(lt, 1.2, 1.45) });
}
// Temporarily redirect the global ctx so helper functions draw elsewhere.
function ctxSwap(o, fn) {
  const saved = ctx; ctx = o; try { o.save(); fn(); o.restore(); } finally { ctx = saved; }
}
</script>
<script>
// ---- frame composer ------------------------------------------------------------
function sceneIndex(t) { return t < 2 ? 0 : t < 5 ? 1 : t < 9 ? 2 : t < 13 ? 3 : t < 16.5 ? 4 : t < 18 ? 5 : 6; }
function draw(t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  const si = sceneIndex(t);
  const [sx, sy, sr] = shake(t);
  ctx.save();
  ctx.translate(540 + sx, 960 + sy); ctx.rotate(sr); ctx.translate(-540, -960);
  if (si !== 5) background(t, si);
  [scene1, scene2, scene3, scene4, scene5, scene6, scene7][si](t);
  ctx.restore();
  // transitions
  flash(t, 2.0, 0.12, 0.35);
  circleWipe(t, 5.0, C.pink);
  bandWipe(t, 9.0);
  glitch(t, Math.max(1 - Math.abs(t - 12.94) / 0.24, 0) * 1.0, 13);
  glitch(t, P(t, 1.42, 1.5) * (1 - P(t, 1.62, 1.75)) * 0.8, 1);
  flash(t, 16.5, 0.06, 0.18, 0.85);
  flash(t, 17.0, 0.0, 0.12, 0.35);
  flash(t, 17.5, 0.0, 0.12, 0.35);
  flash(t, 18.0, 0.1, 0.4);
  flash(t, 18.5, 0.02, 0.25, 0.5);
  hud(t);
  finish(t);
  // fade to black
  const fb = P(t, 19.55, 19.98);
  if (fb > 0) { ctx.fillStyle = `rgba(0,0,0,${eio(fb)})`; ctx.fillRect(0, 0, W, H); }
}
window.draw = draw;
window.ready = Promise.all([
  document.fonts.load('900 100px Montserrat'), document.fonts.load('700 40px Montserrat'),
  document.fonts.load('500 40px "Space Grotesk"'), document.fonts.load('700 40px "Space Grotesk"'),
  document.fonts.load('500 40px "JetBrains Mono"'), document.fonts.load('800 40px "JetBrains Mono"'),
]).then(() => document.fonts.ready);

// Preview: index.html?t=7.2 freezes a frame; otherwise plays in real time.
window.ready.then(() => {
  if (navigator.webdriver) return;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { draw(Number(q.get('t'))); return; }
  const t0 = performance.now();
  const loop = now => { draw(((now - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script>
